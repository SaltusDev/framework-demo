name: CI

on:
  push:
    branches:
      # `dev` is the default branch and release work happens on `release/**`, so without both of
      # these the lint/test/schema gates fire only via pull request — which is how three red steps
      # went unnoticed through a whole release cycle.
      - main
      - dev
      - 'release/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:

jobs:
  ci:
    name: Validate, lint, test, and build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: composer test:lint

      - name: Test
        run: composer test:unit

      - name: Check i18n text domains
        run: composer check-i18n

      # Fails if the committed schema no longer matches the framework surface it was generated
      # from — a framework bump that adds a Codestar field type or a `type` alias turns CI red
      # until the schema is regenerated, rather than letting the two drift silently.
      #
      # Reads the framework from `vendor/`, since only `composer install` has run at this point.
      # `composer prefix-namespaces` is a separate step that creates `vendor-prefixed/`, so a
      # generator resolving that path only would fail here on every run (ROADMAP P6.1a). Both trees
      # answer it identically; the generator tries prefixed first and falls back.
      - name: Check model schema is current
        run: composer schema:check

      # The framework validates no configuration at all: a model with a typo, an unknown field
      # type, or an unlucky key order is dropped silently. This step is that missing layer.
      # Warnings do not fail the build; errors mean a model would not register as written.
      - name: Lint model configuration
        run: composer lint:models

      - name: Build release ZIP
        run: composer build

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: framework-demo-${{ matrix.php }}
          path: dist/*.zip
